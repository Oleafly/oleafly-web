# Standalone workspace root: makes pnpm resolve the docs site independently of
# the app's workspace at the repo root (own node_modules and lockfile).
packages: []

allowBuilds:
  # Pulled in by posthog-js. Its install script only prints a funding notice,
  # so skipping it keeps `pnpm install --frozen-lockfile` quiet in CI.
  core-js: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - astro@7.1.2

overrides:
  esbuild: 0.28.1
